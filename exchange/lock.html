<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGIChainAI — Likidite Kilidi</title>
<style>
  :root { --bg:#0f1115; --kart:#181b22; --kenar:#2a2f3a; --yazi:#e8eaf0; --soluk:#8b93a5; --vurgu:#4f8cff; --hata:#ff6b6b; --ok:#3ecf8e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--yazi); }
  header { padding:14px 18px; border-bottom:1px solid var(--kenar); font-weight:700; font-size:18px; }
  main { max-width:460px; margin:20px auto; padding:0 14px; }
  .kart { background:var(--kart); border:1px solid var(--kenar); border-radius:14px; padding:16px; margin-bottom:14px; }
  h2 { font-size:15px; margin:0 0 10px; }
  label { display:block; font-size:12px; color:var(--soluk); margin:10px 0 4px; }
  select, input { width:100%; background:var(--bg); border:1px solid var(--kenar); border-radius:8px; color:var(--yazi); font-size:16px; padding:10px; }
  button { width:100%; background:var(--vurgu); color:#fff; border:none; border-radius:10px; padding:13px; font-size:16px; margin-top:12px; cursor:pointer; }
  button.ikincil { background:transparent; border:1px solid var(--kenar); color:var(--yazi); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .ince { font-size:13px; color:var(--soluk); line-height:1.5; }
  .adres { font-family:ui-monospace,monospace; font-size:12px; color:var(--soluk); word-break:break-all; }
  .adres a, a { color:var(--vurgu); }
  .durum { min-height:20px; font-size:13px; margin-top:10px; word-break:break-word; }
  .durum.hata { color:var(--hata); } .durum.ok { color:var(--ok); }
  .satir { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--kenar); font-size:14px; }
  .satir:last-child { border-bottom:none; }
  .gizli { display:none; }
</style>
</head>
<body>
<header id="baslik">AGIChainAI — Likidite Kilidi</header>
<main>
  <section class="kart">
    <h2 id="t-ne">Bu sayfa ne yapar?</h2>
    <p class="ince" id="t-aciklama"></p>
    <button id="baglan">Cüzdan bağla</button>
    <div class="ince" id="cuzdan" style="margin-top:8px"></div>
  </section>

  <section class="kart gizli" id="kur-kart">
    <h2 id="t-kur-baslik">1. Kilit sözleşmesi</h2>
    <p class="ince" id="t-kur-aciklama"></p>
    <button id="kur">Kilit sözleşmesini kur</button>
  </section>

  <section class="kart gizli" id="kilit-kart">
    <h2 id="t-kilit-baslik">2. Havuzu kilitle</h2>
    <div class="adres" id="kilit-adres"></div>
    <label for="havuz" id="t-havuz">Havuz</label>
    <select id="havuz"></select>
    <div class="ince" id="lp-bakiye" style="margin-top:6px"></div>
    <label for="miktar" id="t-miktar">Miktar</label>
    <input id="miktar" inputmode="decimal" placeholder="">
    <label for="sure" id="t-sure">Kilit süresi</label>
    <select id="sure">
      <option value="180">6</option><option value="365" selected>12</option><option value="730">24</option><option value="1095">36</option>
    </select>
    <p class="ince" id="t-uyari"></p>
    <p class="ince" id="t-dogrudan"></p>
    <button id="kilitle" disabled>Kilitle</button>
  </section>

  <section class="kart gizli" id="liste-kart">
    <h2 id="t-liste">Bu havuzun kilitleri</h2>
    <div id="liste" class="ince"></div>
  </section>

  <div class="durum" id="durum"></div>
</main>

<script src="ethers.umd.min.js"></script>
<script>/* config her açılışta güncel yüklensin (önbellek atlanır) */ document.write('<script src="config.js?v=' + Date.now() + '"><\/script>');</script>
<script src="kontratlar.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const K = window.DEX_KONTRATLAR;
  const C = window.DEX_CONFIG || {};
  const HEDEF = Number(C.chainId || 84532);
  const EN = HEDEF === 8453; // ana ağ sayfası İngilizce
  const KASIF = { 84532: "https://sepolia.basescan.org", 8453: "https://basescan.org" }[HEDEF] || null;
  const AGLAR = {
    8453: { chainId: "0x2105", chainName: "Base", nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 }, rpcUrls: ["https://mainnet.base.org"], blockExplorerUrls: ["https://basescan.org"] },
    84532: { chainId: "0x14a34", chainName: "Base Sepolia", nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 }, rpcUrls: ["https://sepolia.base.org"], blockExplorerUrls: ["https://sepolia.basescan.org"] },
  };
  const M = EN ? {
    title: "AGIChainAI — Liquidity Lock", ne: "What does this page do?",
    aciklama: "It locks the pool's liquidity (LP tokens) in a time-locked contract. Until the lock expires, nobody — including the person who locked it — can withdraw that liquidity. The lock can only be extended, never shortened. The contract has no owner and no admin.",
    baglan: "Connect wallet", bagli: "Connected", kurBaslik: "1. Lock contract",
    kurAciklama: "No lock contract is configured for this exchange yet. Deploy it once from your wallet; then send the address so it can be added to the site.",
    kur: "Deploy lock contract", kilitBaslik: "2. Lock the pool", havuz: "Pool", sure: "Lock duration (months)",
    uyari: "Warning: this cannot be undone. The locked tokens will be unavailable until the unlock date.",
    dogrudan: "Never send tokens directly to the lock contract address — they would be stuck forever. Only use the Lock button.",
    miktar: "Amount (empty = all)", tokenEtiket: " (token)", sahip: "beneficiary ",
    fazla: "The amount is more than your balance.",
    kilitle: "Lock", liste: "Locks for this asset", yok: "No locks yet.", lp: "Your balance: ", acilis: "unlocks ",
    cekildi: "withdrawn", kilitli: "locked", cek: "Withdraw", noWallet: "No wallet found. Open this page in the MetaMask app's browser.",
    agGec: "Switch your wallet to the right network and try again.", onay: "Waiting for approval in MetaMask…",
    bekle: "Sent; waiting for the blockchain…", kuruldu: "Lock contract deployed. Send this address so it can be added to the site: ",
    kilitlendi: "Locked. It is now verifiable on-chain.", lpYok: "You have no balance of this asset.", reddedildi: "You rejected the transaction in MetaMask.",
    yetki: "Step 1/2: allow the lock contract to take the LP tokens…", kilitAdim: "Step 2/2: locking…", contract: "Lock contract: ",
  } : {
    title: "AGIChainAI — Likidite Kilidi", ne: "Bu sayfa ne yapar?",
    aciklama: "Havuzdaki likiditeyi (LP token'ları) zaman kilitli bir sözleşmeye koyar. Süre dolana kadar hiç kimse — kilidi koyan kişi dahil — o likiditeyi çekemez. Süre yalnızca uzatılabilir, kısaltılamaz. Sözleşmenin sahibi ya da yöneticisi yoktur.",
    baglan: "Cüzdan bağla", bagli: "Bağlandı", kurBaslik: "1. Kilit sözleşmesi",
    kurAciklama: "Bu borsa için henüz bir kilit sözleşmesi tanımlı değil. Cüzdanınızla bir kez kurun; sonra çıkan adresi siteye eklenmesi için gönderin.",
    kur: "Kilit sözleşmesini kur", kilitBaslik: "2. Havuzu kilitle", havuz: "Havuz", sure: "Kilit süresi (ay)",
    uyari: "Uyarı: bu işlem geri alınamaz. Kilitlenen token'lar açılış tarihine kadar kullanılamaz.",
    dogrudan: "Kilit sözleşmesinin adresine asla doğrudan token göndermeyin — sonsuza dek içeride kalır. Yalnızca Kilitle düğmesini kullanın.",
    miktar: "Miktar (boş = tamamı)", tokenEtiket: " (token)", sahip: "hak sahibi ",
    fazla: "Miktar bakiyenizden fazla.",
    kilitle: "Kilitle", liste: "Bu varlığın kilitleri", yok: "Henüz kilit yok.", lp: "Bakiyeniz: ", acilis: "açılış ",
    cekildi: "çekildi", kilitli: "kilitli", cek: "Çek", noWallet: "Cüzdan bulunamadı. Bu sayfayı MetaMask uygulamasının içindeki tarayıcıdan açın.",
    agGec: "Cüzdanınızı doğru ağa geçirip tekrar deneyin.", onay: "MetaMask'ta onay bekleniyor…",
    bekle: "Gönderildi; blokzincire yazılması bekleniyor…", kuruldu: "Kilit sözleşmesi kuruldu. Siteye eklenmesi için bu adresi gönderin: ",
    kilitlendi: "Kilitlendi. Artık blokzincirde doğrulanabilir.", lpYok: "Bu varlıkta bakiyeniz yok.", reddedildi: "İşlemi MetaMask'ta reddettiniz.",
    yetki: "Adım 1/2: kilit sözleşmesine LP token'ları alma izni veriliyor…", kilitAdim: "Adım 2/2: kilitleniyor…", contract: "Kilit sözleşmesi: ",
  };
  document.documentElement.lang = EN ? "en" : "tr";
  document.title = M.title; $("baslik").textContent = M.title; $("t-ne").textContent = M.ne; $("t-aciklama").textContent = M.aciklama;
  $("baglan").textContent = M.baglan; $("t-kur-baslik").textContent = M.kurBaslik; $("t-kur-aciklama").textContent = M.kurAciklama;
  $("kur").textContent = M.kur; $("t-kilit-baslik").textContent = M.kilitBaslik; $("t-havuz").textContent = M.havuz;
  $("t-sure").textContent = M.sure; $("t-uyari").textContent = M.uyari; $("t-dogrudan").textContent = M.dogrudan; $("t-miktar").textContent = M.miktar; $("kilitle").textContent = M.kilitle; $("t-liste").textContent = M.liste;

  const FAB_ABI = ["function getPair(address,address) view returns (address)"];
  const ERC20_ABI = ["function balanceOf(address) view returns (uint256)", "function approve(address,uint256) returns (bool)", "function allowance(address,address) view returns (uint256)", "function symbol() view returns (string)"];
  const GAS = { kur: 1_500_000n, approve: 80_000n, kilitle: 300_000n, cek: 120_000n };
  const SAKLA = "agichain-kilit-" + HEDEF;
  let provider, hesap, kilitAdr = C.kilit || localStorage.getItem(SAKLA) || null;

  const durum = (m, tur) => { $("durum").textContent = m || ""; $("durum").className = "durum" + (tur ? " " + tur : ""); };
  const kasif = (tur, x) => KASIF ? `<a href="${KASIF}/${tur}/${x}" target="_blank" rel="noopener">${x}</a>` : x;
  const hataMetni = (e) => (e && (e.code === 4001 || e.code === "ACTION_REJECTED")) ? M.reddedildi : ("Hata/Error: " + ((e && (e.shortMessage || e.message)) || String(e))).slice(0, 240);

  async function agaGec() {
    const hex = "0x" + HEDEF.toString(16);
    try { await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: hex }] }); }
    catch (e) { if (AGLAR[HEDEF]) await window.ethereum.request({ method: "wallet_addEthereumChain", params: [AGLAR[HEDEF]] }); else throw e; }
  }
  // MetaMask mobil, site iznini ağ başına tutuyor; ağ değişince 'from' reddedilebiliyor.
  async function guvenliGonder(tx) {
    const adresHatasi = (e) => /must provide an Ethereum address|not been authorized|unauthorized/i.test((e && e.message) || "") || (e && e.code === 4100);
    const gonder = (t) => window.ethereum.request({ method: "eth_sendTransaction", params: [t] });
    try { return await gonder({ ...tx, from: tx.from.toLowerCase() }); }
    catch (e1) {
      if (!adresHatasi(e1)) throw e1;
      try {
        await window.ethereum.request({ method: "wallet_requestPermissions", params: [{ eth_accounts: {} }] });
        const h = await window.ethereum.request({ method: "eth_accounts" });
        if (h && h.length) return await gonder({ ...tx, from: h[0].toLowerCase() });
      } catch (e2) { if (e2 && e2.code === 4001) throw e2; if (!adresHatasi(e2)) throw e2; }
      const { from, ...adressiz } = tx;
      return await gonder(adressiz);
    }
  }
  async function gonderVeBekle(to, data, gas) {
    durum(M.onay);
    const tx = { from: hesap, data, gas: "0x" + gas.toString(16) }; if (to) tx.to = to;
    const hash = await guvenliGonder(tx);
    durum(M.bekle + " (" + hash.slice(0, 12) + "…)");
    for (let i = 0; i < 180; i++) {
      const m = await provider.getTransactionReceipt(hash).catch(() => null);
      if (m) { if (m.status === 0) throw new Error("revert: " + hash); return m; }
      await new Promise((r) => setTimeout(r, 2000));
    }
    throw new Error("timeout: " + hash);
  }

  async function baglan() {
    if (!window.ethereum) { durum(M.noWallet, "hata"); return; }
    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    if (Number((await provider.getNetwork()).chainId) !== HEDEF) {
      try { await agaGec(); provider = new ethers.BrowserProvider(window.ethereum); } catch (e) { durum(M.agGec, "hata"); return; }
    }
    let h = await window.ethereum.request({ method: "eth_accounts" });
    if (!h || !h.length) h = await window.ethereum.request({ method: "eth_requestAccounts" });
    hesap = ethers.getAddress(h[0]);
    $("cuzdan").textContent = hesap.slice(0, 8) + "…" + hesap.slice(-6);
    $("baglan").textContent = M.bagli; $("baglan").disabled = true;
    if (!C.factory || !C.weth) { durum(EN ? "The exchange is not deployed on this network yet." : "Borsa bu ağda henüz kurulmadı.", "hata"); return; }
    await ciz();
  }

  async function ciz() {
    $("kur-kart").classList.toggle("gizli", !!kilitAdr);
    $("kilit-kart").classList.toggle("gizli", !kilitAdr);
    $("liste-kart").classList.toggle("gizli", !kilitAdr);
    if (!kilitAdr) return;
    $("kilit-adres").innerHTML = M.contract + kasif("address", kilitAdr);
    if (!$("havuz").options.length) {
      const fab = new ethers.Contract(C.factory, FAB_ABI, provider);
      for (const tk of (C.tokens || [])) {
        const cift = await fab.getPair(tk.address, C.weth);
        if (cift === ethers.ZeroAddress) continue;
        const o = document.createElement("option"); o.value = cift; o.textContent = tk.symbol + " / ETH"; $("havuz").appendChild(o);
      }
      // Projenin kendi token'ı da (kilit sözleşmesinin EK_TOKEN'ı) kilitlenebilir
      const kc0 = new ethers.Contract(kilitAdr, K.Kilit.abi, provider);
      const ek = await kc0.EK_TOKEN().catch(() => ethers.ZeroAddress);
      if (ek !== ethers.ZeroAddress) {
        const sem = (C.tokens || []).find((t) => t.address.toLowerCase() === ek.toLowerCase());
        const o = document.createElement("option"); o.value = ek; o.textContent = (sem ? sem.symbol : "Token") + M.tokenEtiket; $("havuz").appendChild(o);
      }
    }
    await havuzDegisti();
  }

  async function havuzDegisti() {
    const cift = $("havuz").value; if (!cift) return;
    const lp = new ethers.Contract(cift, ERC20_ABI, provider);
    const bakiye = await lp.balanceOf(hesap);
    $("lp-bakiye").textContent = M.lp + ethers.formatEther(bakiye);
    $("kilitle").disabled = bakiye === 0n;
    const kc = new ethers.Contract(kilitAdr, K.Kilit.abi, provider);
    const ids = await kc.tokenKilitleri(cift, 0, 200);
    if (!ids.length) { $("liste").textContent = M.yok; return; }
    // Zincirin saati esas alınır (kilit sözleşmesi de onu kullanır)
    const simdi = (await provider.getBlock("latest")).timestamp;
    const satirlar = [];
    for (const id of ids) {
      const k = await kc.kilit(id);
      const tarih = new Date(Number(k.acilis) * 1000).toLocaleDateString(EN ? "en-GB" : "tr-TR");
      const dur = k.cekildi ? M.cekildi : M.kilitli;
      const benim = k.sahip.toLowerCase() === hesap.toLowerCase();
      const cekilebilir = benim && !k.cekildi && Number(k.acilis) <= simdi;
      satirlar.push(`<div class="satir"><span>#${id} · ${ethers.formatEther(k.miktar)} · ${dur} · ${M.sahip}${k.sahip.slice(0, 6)}…${k.sahip.slice(-4)}</span><span>${M.acilis}${tarih}${cekilebilir ? ` <button class="ikincil" data-cek="${id}" style="width:auto;padding:4px 10px;margin:0">${M.cek}</button>` : ""}</span></div>`);
    }
    $("liste").innerHTML = satirlar.join("");
    $("liste").querySelectorAll("[data-cek]").forEach((b) => b.addEventListener("click", () => cek(BigInt(b.dataset.cek))));
  }

  async function kur() {
    try {
      const f = new ethers.ContractFactory(K.Kilit.abi, K.Kilit.bytecode);
      const ek = (C.tokens && C.tokens[0] && C.tokens[0].address) || ethers.ZeroAddress;
      const { data } = await f.getDeployTransaction(C.factory, ek);
      const m = await gonderVeBekle(null, data, GAS.kur);
      kilitAdr = ethers.getAddress(m.contractAddress); localStorage.setItem(SAKLA, kilitAdr);
      durum(M.kuruldu + kilitAdr, "ok");
      await ciz();
    } catch (e) { durum(hataMetni(e), "hata"); }
  }

  async function kilitle() {
    try {
      const cift = $("havuz").value;
      const lp = new ethers.Contract(cift, ERC20_ABI, provider);
      const bakiye = await lp.balanceOf(hesap);
      const yazilan = $("miktar").value.trim().replace(",", ".");
      const miktar = yazilan ? ethers.parseEther(yazilan) : bakiye;
      if (miktar === 0n || bakiye === 0n) { durum(M.lpYok, "hata"); return; }
      if (miktar > bakiye) { durum(M.fazla, "hata"); return; }
      const iz = new ethers.Interface(ERC20_ABI);
      if ((await lp.allowance(hesap, kilitAdr)) < miktar) {
        durum(M.yetki); await gonderVeBekle(cift, iz.encodeFunctionData("approve", [kilitAdr, miktar]), GAS.approve);
      }
      durum(M.kilitAdim);
      const gun = Number($("sure").value);
      const acilis = BigInt((await provider.getBlock("latest")).timestamp + gun * 86400);
      const ki = new ethers.Interface(K.Kilit.abi);
      await gonderVeBekle(kilitAdr, ki.encodeFunctionData("kilitle", [cift, miktar, acilis, hesap]), GAS.kilitle);
      durum(M.kilitlendi, "ok");
      await havuzDegisti();
    } catch (e) { durum(hataMetni(e), "hata"); }
  }

  async function cek(id) {
    try {
      const ki = new ethers.Interface(K.Kilit.abi);
      await gonderVeBekle(kilitAdr, ki.encodeFunctionData("cek", [id]), GAS.cek);
      await havuzDegisti(); durum("✓", "ok");
    } catch (e) { durum(hataMetni(e), "hata"); }
  }

  $("baglan").addEventListener("click", () => baglan().catch((e) => durum(hataMetni(e), "hata")));
  $("kur").addEventListener("click", kur);
  $("kilitle").addEventListener("click", kilitle);
  $("havuz").addEventListener("change", () => havuzDegisti().catch((e) => durum(hataMetni(e), "hata")));
})();
</script>
</body>
</html>
